<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="/static/css/output.css" rel="stylesheet" />

    <title></title>
  </head>
  <body>
    <div class="navbar bg-base-100 shadow-sm">
      <div class="flex-1">
        <a class="btn btn-ghost text-xl">Horvert Persianas</a>
      </div>
      <div class="flex-none">
        <button class="btn btn-square btn-ghost">
          <%= require('../assets/icons/gear.svg?raw') %>
        </button>
      </div>
    </div>

    <!-- Container with 12 columns -->

    <div class="grid grid-rows-[auto_1fr] gap-4 w-full h-screen">
      <!-- Takes up 25% width (3 out of 12 columns) -->

      <div
        class="flex col-span-3 data-name-control-panel"
        id="panel-control-container"
      ></div>

      <div class="overflow-auto">
        <table id="myTable" class="display">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <dialog id="dialog-recycle" class="modal">
      <div
        class="modal-box w-11/12 max-w-3xl flex flex-col gap-4 relative overflow-visible"
      >
        <!-- Header -->
        <h3 id="dialog-header" class="text-lg font-bold"></h3>

        <p id="dialog-recycle-message"></p>

        <!-- Modal Footer Actions -->
        <div class="modal-action flex justify-end gap-2 mt-4">
          <form method="dialog">
            <button id="dialog-recycle-cancel-btn" class="btn btn-ghost">
              No crear nuevo objeto
            </button>
          </form>
          <button
            id="dialog-recycle-accept-btn"
            form="dialog-recycle"
            type="submit"
            class="btn btn-primary"
          >
            Crear nuevo objecto
          </button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/static/bundle.js"></script>
  </body>
</html>
