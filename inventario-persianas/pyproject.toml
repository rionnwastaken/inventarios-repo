[project]
name = "inventario-persianas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"SQLAlchemy==2.0.50",
"Flask==3.1.3",
"Flask-SQLAlchemy==3.1.1",
"pandas==3.0.3",
"platformdirs==4.10.0",
"sqlmodel==0.0.38",
"pydantic-to-typescript==2.0.0"

]



[tool.pyright]
venv = ".venv"
venvPath = "."

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

