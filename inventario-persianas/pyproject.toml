[project]
name = "inventario-persianas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.0.50",
    "sqlmodel<0.0.23", # Pin to an older version that supports Python 3.8
    "pillow==10.4.0",
    "platformdirs",
]

[dependency-groups]
dev = [
    "pandas",
    "openpyxl",
    "xlrd",
    "pydantic-to-typescript",
    "tabulate",
]


[tool.pyright]
venv = ".venv"
venvPath = "."

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff.lint]
ignore = ["E711", "E712", "E402", "F841"]
